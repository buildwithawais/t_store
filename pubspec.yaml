name: t_store
description: "Happy Shopping's"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

#-------------PACKAGES------------------#
dependencies:
  flutter:
    sdk: flutter

  #Utility Packages
  http: ^1.5.0
  intl: ^0.20.2
  logger: ^2.6.1
  lottie: ^3.3.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  flutter_native_splash: ^2.4.6
  smooth_page_indicator: ^1.2.1
  carousel_slider: ^5.1.1
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1

  #Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  #State Management
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.3.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.2.0
  shimmer: ^3.0.0
  image_picker: ^1.2.0
  supabase_flutter: ^2.10.2
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.13.1

  #Product Specific


#-------------PACKAGES END ------------------#
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

#--------------LOCAL ASSETS--------------#
  assets:
    - assets/images/on_boarding_images/
    - assets/logos/
    - assets/icons/
    - assets/images/animations/
    - assets/icons/categories/
    - assets/images/banners/
    - assets/images/products/
    - assets/images/profile/
    - assets/images/reviews/
    - assets/images/brands/
    - assets/icons/brands/
    - assets/icons/payment_methods/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/t-store-splash-logo-black.png"




























